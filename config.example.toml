# Copy to config.toml. Secrets belong in process environment, never this file.
mode = "browser" # fresh installs open the setup wizard in safe dry-run mode
database = "data/x-shill.sqlite3"
host = "127.0.0.1"
port = 8787
# For remote use, set a strong DASHBOARD_PASSWORD and this HTTPS origin.
public_origin = ""
timezone = "America/Chicago"
daily_post_limit = 10
minimum_gap_minutes = 60
quiet_start = 22
quiet_end = 8
max_attempts = 4
lease_seconds = 120
worker_interval_seconds = 5
max_schedule_days = 90

[model]
provider = "template" # template (free/offline) or openai-compatible
base_url = "https://api.openai.com/v1"
name = "" # Explicit model and verified prices required for paid generation
daily_budget_usd = 0.0
input_usd_per_million = 0.0
output_usd_per_million = 0.0
max_output_tokens = 1800
# Paid mode reads MODEL_API_KEY. No credentials are sent in demo/template mode.

[browser]
# Browser mode uses a dedicated local Chromium profile. Run browser-login once.
# Start with dry_run=true; it discovers and drafts without clicking Post.
dry_run = true
headless = true
profile_dir = "data/x-browser-profile"
base_url = "https://x.com"
search_queries = ["Cronos crypto", "Cronos chain", "#CROFam"]
watch_accounts = ["cronos_chain", "cryptocom"]
poll_minutes = 20
minimum_score = 35
discovery_limit = 30
per_source_limit = 10
discovery_scrolls = 1
preview_batch_size = 10
require_keyword_match = true
blocked_accounts = []
author_cooldown_days = 14
similarity_limit = 0.82
reply_provider = "template" # template or ollama
template_fallback = true
autostart = false
diagnostics_dir = "data/browser-diagnostics"
# Local contextual writing option:
# reply_provider = "ollama"
# ollama_url = "http://127.0.0.1:11434"
# ollama_model = "qwen3:4b"
# ollama_timeout_seconds = 60
